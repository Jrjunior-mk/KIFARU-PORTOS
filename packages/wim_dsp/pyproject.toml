[project]
name = "kifaru-wim-dsp"
version = "0.1.0"
description = "Weigh-in-motion signal generation and processing (reference Python implementation of the STM32 pipeline)"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "scipy>=1.13"]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kifaru_wim_dsp*"]
