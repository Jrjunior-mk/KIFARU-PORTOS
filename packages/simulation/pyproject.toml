[project]
name = "kifaru-sim"
version = "0.1.0"
description = "SimPy weighbridge/port queue simulation and scenario comparison for KIFARU PORTOS"
requires-python = ">=3.12"
dependencies = ["simpy>=4.1", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kifaru_sim*"]
