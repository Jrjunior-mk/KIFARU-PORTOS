name: kifaru_mobile
description: KIFARU PORTOS driver and cargo-owner mobile application (Flutter).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  flutter_secure_storage: ^9.0.0
  web_socket_channel: ^2.4.0
  geolocator: ^11.0.0
  flutter_tts: ^4.0.2
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  wakelock_plus: ^1.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
