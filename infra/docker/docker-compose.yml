# KIFARU PORTOS - local full stack.
#   docker compose --env-file .env.compose -f infra/docker/docker-compose.yml up --build
# Services: postgres:16 (schemas core/pii/ts), redis:7, emqx:5 (MQTT 1883/8883 + dashboard 18083), api (migrate -> seed
# -> uvicorn), web (nginx serving the Vite build). See docs/06-operations/local-development.md.
name: kifaru

x-api-common: &api-common
  build:
    context: ../..
    dockerfile: apps/api/Dockerfile
  image: kifaru/api:local
  env_file:
    - ${KIFARU_COMPOSE_ENV_FILE:-.env.compose}
  environment:
    KIFARU_ENV: dev
    KIFARU_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kifaru}:${POSTGRES_PASSWORD:-kifaru_dev}@postgres:5432/${POSTGRES_DB:-kifaru}
    KIFARU_REDIS_URL: redis://redis:6379/0
    KIFARU_MQTT_HOST: emqx
    KIFARU_MQTT_PORT: "1883"
    KIFARU_LOCAL_OBJECT_DIR: /data/objects
    KIFARU_PUBLIC_BASE_URL: http://localhost:${WEB_PORT:-5173}
    KIFARU_CORS_ORIGINS: '["http://localhost:${WEB_PORT:-5173}","http://localhost:5173","http://localhost:3000"]'
  volumes:
    - objects:/data/objects
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    emqx:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kifaru}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kifaru_dev}
      POSTGRES_DB: ${POSTGRES_DB:-kifaru}
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "log_min_duration_statement=1000"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  emqx:
    image: emqx:5
    environment:
      EMQX_NAME: kifaru
      EMQX_HOST: 127.0.0.1
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-kifaru_dev}
      EMQX_ALLOW_ANONYMOUS: "true" # local only; cloud uses IoT Core mTLS / EMQX per-device auth
    ports:
      - "${MQTT_PORT:-1883}:1883"   # MQTT
      - "${MQTTS_PORT:-8883}:8883"  # MQTT over TLS (EMQX default self-signed cert)
      - "${MQTT_WS_PORT:-8083}:8083" # MQTT over WebSocket
      - "${EMQX_DASHBOARD_PORT:-18083}:18083" # dashboard (admin / EMQX_DASHBOARD_PASSWORD)
    volumes:
      - emqxdata:/opt/emqx/data
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  api:
    <<: *api-common
    command:
      - /bin/sh
      - -c
      - |
        set -e
        echo "[api] applying migrations" && alembic upgrade head
        if [ "$${KIFARU_SEED_DEMO:-true}" = "true" ]; then echo "[api] seeding demo data" && python -m kifaru.seed --quiet; fi
        exec uvicorn kifaru.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips '*'
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Background roles share the image. The entrypoints `kifaru.worker` / `kifaru.ingest` are application work in progress;
  # these services are disabled by default (profile "workers") until they exist.
  worker:
    <<: *api-common
    profiles: ["workers"]
    command: ["python", "-m", "kifaru.worker"]
    depends_on:
      api:
        condition: service_healthy

  ingest:
    <<: *api-common
    profiles: ["workers"]
    command: ["python", "-m", "kifaru.ingest"]
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
      args:
        # Empty => the SPA calls same-origin /api and /ws, which nginx proxies to API_UPSTREAM (see apps/web/Dockerfile).
        VITE_API_BASE: ""
        VITE_WS_BASE: ""
    image: kifaru/web:local
    environment:
      API_UPSTREAM: http://api:8000
      NGINX_PORT: "80"
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  emqxdata:
  objects:
